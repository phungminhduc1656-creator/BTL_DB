# Alternative local MySQL for computers using Docker. Never use together with scripts/start-mysql.ps1 on3307.
services:
  mysql:
    image: mysql:8.4
    command: ["--skip-log-bin"]
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: pickleball_db
      MYSQL_USER: pickleball_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-pickleball_local_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_demo_2026}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pickleball_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pickleball_mysql:
