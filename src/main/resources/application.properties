spring.application.name=pickleball-manager
server.address=${APP_HOST:127.0.0.1}
server.port=${APP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/pickleball_db?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=%2B07:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:pickleball_app}
spring.datasource.password=${DB_PASSWORD:pickleball_local_2026}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
spring.datasource.hikari.connection-timeout=5000
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
spring.web.resources.cache.cachecontrol.no-cache=true
server.error.include-message=never
server.error.include-stacktrace=never
app.setup=${APP_SETUP:false}
app.seed=${APP_SEED:false}
app.admin-password=${ADMIN_PASSWORD:admin123}
